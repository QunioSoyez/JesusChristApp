name = "church-finder"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Church tiles built by data-build/build.sh (data/ is not in git). The monthly GitHub Actions job
# (.github/workflows/church-data.yml) builds them and deploys. A local `wrangler deploy` without
# a data/ folder fails on purpose, so it can't publish a worker with no churches.
[assets]
directory = "./data"
binding = "ASSETS"
